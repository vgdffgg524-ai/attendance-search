<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيسي يگدار - نظام معلومات العملاء</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f8fc;
    color:#172b4d;
}

.header{
    background:#0757a8;
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-circle{
    width:42px;
    height:42px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0757a8;
    font-size:22px;
    font-weight:bold;
}

.title{
    font-size:22px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    opacity:.85;
    margin-top:4px;
}

.container{
    max-width:1100px;
    margin:28px auto;
    padding:0 18px;
}

.card{
    background:white;
    border:1px solid #e3eaf2;
    border-radius:16px;
    padding:24px;
    box-shadow:0 6px 25px rgba(20,50,90,.07);
}

.search-title{
    text-align:center;
    font-size:22px;
    margin-bottom:8px;
}

.search-hint{
    text-align:center;
    color:#7b8794;
    font-size:13px;
    margin-bottom:22px;
}

.search-box{
    display:flex;
    gap:10px;
}

.search-box input{
    flex:1;
    height:52px;
    border:1px solid #ccd8e5;
    border-radius:10px;
    padding:0 18px;
    font-size:16px;
    outline:none;
}

.search-box input:focus{
    border-color:#0875d1;
}

.search-btn{
    width:120px;
    border:none;
    border-radius:10px;
    background:#0875d1;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.search-btn:hover{
    background:#075da8;
}

.section{
    margin-top:28px;
}

.section-title{
    font-size:18px;
    margin-bottom:14px;
}

.results{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.result{
    border:1px solid #e1e8f0;
    border-radius:12px;
    padding:16px;
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 35px;
    align-items:center;
    gap:15px;
    cursor:pointer;
    transition:.2s;
}

.result:hover{
    box-shadow:0 5px 18px rgba(20,70,120,.10);
    border-color:#b9d5ef;
}

.value{
    font-weight:bold;
}

.label{
    color:#7b8794;
    font-size:11px;
    margin-top:5px;
}

.arrow{
    color:#0875d1;
    font-size:25px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#7b8794;
    border:1px dashed #ccd8e5;
    border-radius:12px;
}

.details{
    display:none;
}

.detail-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.back-btn{
    border:none;
    background:#eaf3fc;
    color:#0757a8;
    padding:10px 16px;
    border-radius:9px;
    cursor:pointer;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.detail-item{
    background:#f7f9fc;
    border-radius:11px;
    padding:15px;
}

.detail-label{
    color:#7b8794;
    font-size:12px;
    margin-bottom:7px;
}

.detail-value{
    font-weight:bold;
    font-size:15px;
}

.footer{
    text-align:center;
    color:#8a96a3;
    font-size:12px;
    padding:25px;
}

@media(max-width:700px){

    .header{
        padding:15px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-btn{
        width:100%;
        height:50px;
    }

    .result{
        grid-template-columns:1fr 1fr;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">

        <div class="logo-circle">P</div>

        <div>
            <div class="title">بيسي يگدار</div>
            <div class="subtitle">نظام معلومات العملاء</div>
        </div>

    </div>

    <div>👤</div>

</header>


<div class="container">

<div class="card">

    <h1 class="search-title">🔎 البحث عن العميل</h1>

    <div class="search-hint">
        يمكنك البحث بالاسم التجاري أو الاسم الثلاثي أو جزء من الاسم
    </div>


    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="اكتب الاسم التجاري أو الاسم الثلاثي ..."
        >

        <button class="search-btn" onclick="searchCustomer()">
            🔍 بحث
        </button>

    </div>


    <div class="section">

        <h2 class="section-title">
            👥 نتائج البحث
            <span id="resultCount"></span>
        </h2>

        <div id="results" class="results">

            <div class="empty">
                اكتب اسم العميل ثم اضغط بحث.
            </div>

        </div>

    </div>


    <div id="details" class="section details">

        <div class="detail-header">

            <h2 class="section-title">
                بيانات العميل
            </h2>

            <button class="back-btn" onclick="closeDetails()">
                ← رجوع
            </button>

        </div>

        <div id="detailGrid" class="detail-grid"></div>

    </div>

</div>

</div>


<div class="footer">
    © 2026 نظام معلومات العملاء
</div>


<script>

/*
=========================================
بيانات العملاء
=========================================

هنا لاحقاً نربط بيانات Excel الأصلية.

حالياً هذه بيانات تجريبية فقط للواجهة.
لا تعتبرها بيانات ملف Excel.
*/

const customers = [

    {
        commercial:"بركات الزهراء",
        name:"حامد مراد عطية",
        phone:"07712345678",
        route:"12",
        address:"بغداد - حي الجامعة"
    },

    {
        commercial:"بركات الزهراء",
        name:"علي كاظم حسن",
        phone:"07823456789",
        route:"7",
        address:"بغداد - حي الجامعة"
    },

    {
        commercial:"بركات الزهراء",
        name:"محمد عبد الحسين",
        phone:"07734567890",
        route:"15",
        address:"بغداد - حي الجامعة"
    }

];


let currentResults = [];


function normalize(text){

    return String(text || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


function searchCustomer(){

    const query =
        normalize(
            document.getElementById("searchInput").value
        );

    const results =
        document.getElementById("results");

    const count =
        document.getElementById("resultCount");


    if(!query){

        results.innerHTML =
            '<div class="empty">اكتب اسم العميل أولاً.</div>';

        count.textContent = "";

        return;
    }


    currentResults =
        customers.filter(customer => {

            return normalize(customer.commercial).includes(query)
                || normalize(customer.name).includes(query);

        });


    count.textContent =
        " (" + currentResults.length + ")";


    if(currentResults.length === 0){

        results.innerHTML =
            '<div class="empty">لم يتم العثور على عميل مطابق.</div>';

        return;
    }


    results.innerHTML =
        currentResults.map((customer,index) => {

            return `

            <div class="result"
                 onclick="showDetails(${index})">

                <div>
                    <div class="value">
                        ${customer.commercial}
                    </div>

                    <div class="label">
                        الاسم التجاري
                    </div>
                </div>


                <div>

                    <div class="value">
                        ${customer.name}
                    </div>

                    <div class="label">
                        الاسم الثلاثي
                    </div>

                </div>


                <div>

                    <div class="value">
                        ${customer.phone}
                    </div>

                    <div class="label">
                        الهاتف
                    </div>

                </div>


                <div class="arrow">
                    ‹
                </div>

            </div>

            `;

        }).join("");

}


function showDetails(index){

    const customer =
        currentResults[index];

    const grid =
        document.getElementById("detailGrid");


    grid.innerHTML = `

        <div class="detail-item">

            <div class="detail-label">
                الاسم التجاري
            </div>

            <div class="detail-value">
                ${customer.commercial}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                الاسم الثلاثي
            </div>

            <div class="detail-value">
                ${customer.name}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                الهاتف
            </div>

            <div class="detail-value">
                ${customer.phone}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                المسار
            </div>

            <div class="detail-value">
                ${customer.route}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                العنوان
            </div>

            <div class="detail-value">
                ${customer.address}
            </div>

        </div>

    `;


    document.getElementById("details").style.display =
        "block";


    document.getElementById("details")
        .scrollIntoView({
            behavior:"smooth"
        });

}


function closeDetails(){

    document.getElementById("details").style.display =
        "none";

}


document
.getElementById("searchInput")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        searchCustomer();

    }

});

</script>

</body>
</html>
